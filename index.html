<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎂 Happy Birthday 💖</title>

<style>
  body {
    font-family: 'Comic Sans MS', cursive;
    background: linear-gradient(135deg, pink, lavender);
    text-align: center;
    padding: 24px;
    margin: 0;
    overflow: hidden;
  }

  h1 {
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    color: #ff1493;
    margin-bottom: 10px;
  }

  p {
    font-size: clamp(1.4rem, 4.5vw, 1.8rem);
    margin: 10px 0;
  }

  button {
    font-size: clamp(1.3rem, 4.5vw, 1.6rem);
    padding: 18px 32px;
    border: none;
    border-radius: 16px;
    background-color: #ff69b4;
    color: white;
    cursor: pointer;
    margin: 10px;
  }

  button:hover {
    background-color: #ff1493;
  }

  .danger {
    background: #e74c3c;
  }

  .hidden {
    display: none;
  }

  @keyframes shake {
    0% { transform: translate(0, 0); }
    25% { transform: translate(6px, 4px); }
    50% { transform: translate(-6px, -4px); }
    75% { transform: translate(4px, -6px); }
    100% { transform: translate(0, 0); }
  }

  .confetti {
    position: fixed;
    width: 8px;
    height: 14px;
    top: -20px;
    animation: fall linear infinite;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(360deg);
    }
  }

  #scanBox {
    width: 90%;
    max-width: 520px;
    margin: 20px auto;
    padding: 16px;
    background: #111;
    color: #0f0;
    border-radius: 10px;
    font-family: monospace;
    font-size: 1rem;
  }

  #bar {
    height: 14px;
    width: 0%;
    background: #0f0;
    margin-top: 10px;
  }
</style>
</head>

<body>

<h1 id="title">🎉 Happy Birthday! 🎉</h1>
<p id="subtitle">Tap the button for a surprise 💝</p>

<button id="startBtn" onclick="startLegendary()">🎁 Open Gift 🎁</button>
<button id="sorryBtn" class="danger hidden" onclick="sorryClicked()">🙏 Sorry</button>

<div id="scanBox" class="hidden">
  Running Birthday Scan… <span id="pct">0%</span>
  <div id="bar"></div>
</div>

<audio id="music" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-happy.mp3">
</audio>

<!-- 🔔 NEW: Continuous alarm sound -->
<!-- 🔔 NEW: Security alert horn -->
<audio id="alarm" loop>
  <source src="https://www.soundjay.com/alarms/sounds/air-horn-1.mp3">
</audio>

<script>
  const name = "Kelsey";
  const sweetMessage =
    "I love you so much ❤️ Happy Birthday! Thanks for being you. — Your Husband";

  const titles = [
    "🎉 HAPPY BIRTHDAY!!!",
    "⚠️ SYSTEM WARNING",
    "🚨 ESCALATION DETECTED",
    "🔥 BIRTHDAY OVERLOAD",
    "💀 CRITICAL BIRTHDAY FAILURE",
    "🌋 MAXIMUM BIRTHDAY CHAOS"
  ];

  const popups = [
    `🎉 HAPPY BIRTHDAY ${name.toUpperCase()}!!! 🎂`,
    "🎈 SURPRISE AGAIN 🎈",
    "💥 ERROR: TOO MUCH BIRTHDAY 💥",
    "⚠️ WARNING: BIRTHDAY INTENSITY RISING ⚠️",
    "🚨 ALERT: BIRTHDAY UNSTABLE 🚨",
    "🔥 CRITICAL BIRTHDAY EVENT IMMINENT 🔥",
    "💀 SYSTEM MELTDOWN: TOO MUCH CELEBRATION 💀"
  ];

  let speed = 1100;
  let count = 0;
  let scan = 0;

  function rand(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function popup() {
    alert(rand(popups));
  }

  function chaos() {
    popup();
    count++;
    document.title = rand(titles);

    if (count > 4) {
      document.body.style.animation = "shake 0.25s infinite";
    }
    if (count > 10) {
      document.body.style.animation = "shake 0.15s infinite";
    }
    if (count > 15) {
      document.body.style.animation = "shake 0.1s infinite";
    }

    if (speed > 200) {
      speed -= 100;
    }

    if (count === 5) startConfetti();
    if (count === 7) document.getElementById("alarm").play();
    if (count === 9) startFakeScan();
    if (count === 13) {
      document.getElementById("sorryBtn").classList.remove("hidden");
    }
    if (count === 20) {
      finale();
      return;
    }

    setTimeout(chaos, speed);
  }

  function startLegendary() {
    document.getElementById("music").play();
    chaos();
  }

  function startConfetti() {
    for (let i = 0; i < 90; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = `hsl(${Math.random() * 360}, 100%, 60%)`;
      c.style.animationDuration = Math.random() * 2 + 2 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 6000);
    }
  }

  function startFakeScan() {
    const box = document.getElementById("scanBox");
    const pct = document.getElementById("pct");
    const bar = document.getElementById("bar");
    box.classList.remove("hidden");

    const timer = setInterval(() => {
      scan += 10;
      pct.textContent = scan + "%";
      bar.style.width = scan + "%";
      if (scan >= 100) clearInterval(timer);
    }, 300);
  }

  function sorryClicked() {
    alert("😈 Too late… escalation cannot be stopped.");
  }

  function finale() {
    document.body.style.animation = "none";
    document.getElementById("scanBox").classList.add("hidden");
    document.getElementById("sorryBtn").classList.add("hidden");

    document.getElementById("title").textContent = "🎂 FINAL BIRTHDAY FORM 🎂";
    document.getElementById("subtitle").textContent = sweetMessage;

    startConfetti();
  }

  window.onbeforeunload = () =>
    "One last birthday thing… 🎂";
</script>

</body>
</html>
